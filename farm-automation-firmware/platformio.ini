; PlatformIO Configuration for Farm Automation System
; 
; This is an alternative to Arduino IDE.
; Install PlatformIO: https://platformio.org/install
; 
; Usage:
;   pio run              - Build the project
;   pio run -t upload    - Upload to ESP32
;   pio device monitor   - Open serial monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Libraries
lib_deps =
    adafruit/Adafruit IO Arduino@^6.0.0
    adafruit/Adafruit MQTT Library@^2.5.0
    adafruit/Adafruit Unified Sensor@^1.1.9
    adafruit/DHT sensor library@^4.0.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; Build flags
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0

; Upload speed
upload_speed = 921600
